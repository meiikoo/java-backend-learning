server:
  port: 8080

app:
  name: ${APP_NAME:springboot-7-day}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bootcamp?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:bootcamp}
    password: ${DB_PASSWORD:bootcamp}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

